# Low-level controller case: one robot and one goal in a cluttered zig-zag map.
# The wall gaps alternate sides (right, then left), so the robot has to wind up to the goal near the top
# and come back down into the middle corridor to deliver it.
# Passages are at least 2.5 m wide: the reference local A* inflates obstacles by 0.81 m on a 0.3 m grid
# and gets stuck in front of a 2.1 m gap.
agents:
  PDM4AR_1:
    state:
      x: -9
      y: -9
      psi: 0
    color: 'saddlebrown'
    capacity: 1

shared_goals:
  - id: 'goal_1'
    value: 100
    assigned_robot: null
    center: [ 0, 9 ]
    radius: 0.3

# Collection points where goals should be delivered
collection_points:
  - id: 'collection_1'
    center: [ -5, -3.5 ]
    radius: 0.8

static_obstacles:
  # zig-zag walls: gap on the right, then gap on the left
  - [ [ -11, -6.3 ], [ 8.4, -6.3 ], [ 8.4, -5.7 ], [ -11, -5.7 ], [ -11, -6.3 ] ]
  - [ [ -8.4, 0.7 ], [ 11, 0.7 ], [ 11, 1.3 ], [ -8.4, 1.3 ], [ -8.4, 0.7 ] ]
  # bottom corridor
  - [ [ -5, -11 ], [ -3.5, -11 ], [ -3.5, -8.8 ], [ -5, -8.8 ], [ -5, -11 ] ]
  - [ [ 0, -8.2 ], [ 1.5, -7.1 ], [ 0.5, -5.9 ], [ -0.8, -6.9 ], [ 0, -8.2 ] ]
  - [ [ 4.5, -11 ], [ 6, -11 ], [ 6, -9 ], [ 4.5, -9 ], [ 4.5, -11 ] ]
  # middle corridor
  - [ [ 6, -3.5 ], [ 7.5, -3.5 ], [ 7.5, -2 ], [ 6, -2 ], [ 6, -3.5 ] ]
  - [ [ 2, -2.2 ], [ 3.5, -2.2 ], [ 3.5, 0.7 ], [ 2, 0.7 ], [ 2, -2.2 ] ]
  - [ [ -2.5, -5.7 ], [ -1, -5.7 ], [ -1, -3 ], [ -2.5, -3 ], [ -2.5, -5.7 ] ]
  # top corridor
  - [ [ -6, 3.5 ], [ -4.5, 5 ], [ -6, 6.5 ], [ -7.5, 5 ], [ -6, 3.5 ] ]
  - [ [ -2, 1.3 ], [ -0.5, 1.3 ], [ -0.5, 4.5 ], [ -2, 4.5 ], [ -2, 1.3 ] ]
  - [ [ 1.5, 6.5 ], [ 3, 6.5 ], [ 3, 11 ], [ 1.5, 11 ], [ 1.5, 6.5 ] ]
  - [ [ 4.5, 4 ], [ 8, 4 ], [ 8, 5.5 ], [ 4.5, 5.5 ], [ 4.5, 4 ] ]

boundary: [ [ -11, -11 ], [ -11, 11 ], [ 11, 11 ], [ 11, -11 ], [ -11, -11 ] ]

seed: 7
